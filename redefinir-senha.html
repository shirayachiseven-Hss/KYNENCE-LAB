<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha | KYNENCE LAB</title>
    
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #0B1F33, #123B50);
    font-family: Arial, sans-serif;
    color: #17202A;
}

form {
    width: 100%;
    max-width: 420px;
    padding: 38px 30px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    animation: aparecer .6s ease;
}

h1 {
    max-width: 420px;
    color: white;
    font-size: 25px;
    text-align: center;
    position: absolute;
    top: 28%;
    transform: translateY(-50%);
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #E4E7EC;
    border-radius: 9px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #0F766E;
    box-shadow: 0 0 0 3px rgba(15,118,110,.12);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 9px;
    background: #0F766E;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #0B5D57;
    transform: translateY(-2px);
}

#message {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
    overflow-wrap: anywhere;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 480px) {
    form {
        padding: 30px 22px;
    }

    h1 {
        font-size: 22px;
    }
}
</style>
</head>
<body>

    <h1>Nova palavra-passe</h1>

    <form id="reset-form">
        <input type="password" id="password"
            placeholder="Nova palavra-passe" required minlength="8">

        <button type="submit">Guardar palavra-passe</button>
        <p id="message"></p>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dados/supabase.js"></script>

    <script>
        const form = document.getElementById("reset-form");
        const message = document.getElementById("message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const password = document.getElementById("password").value;

            const { error } = await kynenceSupabase.auth.updateUser({
                password: password
            });

            if (error) {
                message.textContent = error.message;
                return;
            }

            message.textContent = "Palavra-passe atualizada com sucesso!";
        });
    </script>

</body>
</html>
