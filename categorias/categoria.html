<!DOCTYPE html>
<html lang="pt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        id="categoryMetaDescription"
        content="Explore os artigos da KYNENCE LAB por categoria."
    >

    <meta
        name="theme-color"
        content="#0B1F33"
    >

    <title>Categoria — KYNENCE LAB</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>

<body>

<!-- ==================================================
     CABEÇALHO
================================================== -->

<header class="header">

    <div class="header-container">

        <!-- LOGO -->

        <a
            href="../index.html"
            class="logo"
            aria-label="KYNENCE LAB — Página inicial"
        >

            <span class="logo-main">
                KYNENCE
            </span>

            <span class="logo-lab">
                LAB
            </span>

        </a>


        <!-- BOTÃO MENU MOBILE -->

        <button
            id="menuButton"
            class="menu-button"
            type="button"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="navigation"
        >
            ☰
        </button>


        <!-- NAVEGAÇÃO -->

        <nav
            id="navigation"
            class="navigation"
            aria-label="Navegação principal"
        >

            <a href="../pesquisa.html">
                🔎 Pesquisa
            </a>

            <a href="../index.html">
                Início
            </a>

            <a href="categoria.html?categoria=financas">
                Finanças
            </a>

            <a href="categoria.html?categoria=economia">
                Economia
            </a>

            <a href="categoria.html?categoria=investimentos">
                Investimentos
            </a>

            <a href="categoria.html?categoria=educacao">
                Educação
            </a>

            <a href="../index.html#sobre">
                Sobre
            </a>

        </nav>

    </div>

</header>


<!-- ==================================================
     CONTEÚDO PRINCIPAL
================================================== -->

<main class="category-page">


    <!-- ==================================================
         CABEÇALHO DA CATEGORIA
    ================================================== -->

    <section class="category-header">

        <div class="container">

            <span
                class="article-category"
                id="categoryLabel"
            >
                CATEGORIA
            </span>


            <h1 id="categoryTitle">
                Artigos
            </h1>


            <p id="categoryDescription">
                Explore os conteúdos da KYNENCE LAB.
            </p>

        </div>

    </section>


    <!-- ==================================================
         LISTA DE ARTIGOS
    ================================================== -->

    <section class="section">

        <div class="container">

            <div
                id="categoryArticles"
                class="articles-grid"
            >

                <!--
                    Os artigos publicados da categoria
                    serão inseridos automaticamente
                    pelo categoria.js.
                -->

            </div>

        </div>

    </section>


</main>


<!-- ==================================================
     RODAPÉ
================================================== -->

<footer class="site-footer">

    <div class="container">

        <div class="footer-main">

            <div>

                <div class="logo footer-logo">

                    <span class="logo-main">
                        KYNENCE
                    </span>

                    <span class="logo-lab">
                        LAB
                    </span>

                </div>


                <p>
                    Entenda o dinheiro.
                    Entenda a economia.
                </p>

            </div>


            <div class="footer-links">

                <a href="../index.html">
                    Início
                </a>

                <a href="categoria.html?categoria=financas">
                    Finanças
                </a>

                <a href="categoria.html?categoria=economia">
                    Economia
                </a>

                <a href="categoria.html?categoria=investimentos">
                    Investimentos
                </a>

                <a href="categoria.html?categoria=educacao">
                    Educação Financeira
                </a>

                <a href="categoria.html?categoria=trabalho">
                    Trabalho &amp; Renda
                </a>

            </div>

        </div>


        <div class="footer-bottom">

            © <span id="currentYear"></span> KYNENCE LAB.

        </div>

    </div>

</footer>


<!-- ==================================================
     JAVASCRIPT
================================================== -->

<!-- Catálogo de artigos -->
<script src="../dados/artigos.js"></script>

<!-- Catálogo de categorias -->
<script src="../dados/categorias.js"></script>

<!-- Sistema global: menu, ano, etc. -->
<script src="../script.js"></script>

<!-- Sistema específico da categoria -->
<script src="../dados/categoria.js"></script>


</body>
</html>
