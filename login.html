<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | KYNENCE LAB</title>
    
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: linear-gradient(135deg, #0B1F33, #123B50);
    font-family: Arial, sans-serif;
    color: #17202A;
}

.login-container {
    width: 100%;
    max-width: 420px;
    padding: 38px 30px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
    animation: aparecer .6s ease;
}

.login-container h1 {
    color: #0F766E;
    font-size: 27px;
    margin-bottom: 10px;
    text-align: center;
}

.login-container > p {
    color: #667085;
    text-align: center;
    margin-bottom: 28px;
}

label {
    display: block;
    font-weight: 600;
    margin: 16px 0 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #E4E7EC;
    border-radius: 9px;
    outline: none;
    font-size: 15px;
    transition: .3s;
}

input:focus {
    border-color: #0F766E;
    box-shadow: 0 0 0 3px rgba(15,118,110,.12);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 22px;
    border: none;
    border-radius: 9px;
    background: #0F766E;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

button:hover {
    background: #0B5D57;
    transform: translateY(-2px);
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

#forgot-password {
    display: inline-block;
    margin-top: 15px;
    color: #0F766E;
    font-size: 14px;
    text-decoration: none;
}

#forgot-password:hover {
    text-decoration: underline;
}

#login-message {
    margin-top: 15px;
    font-size: 14px;
    text-align: center;
    overflow-wrap: anywhere;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <h1>KYNENCE LAB</h1>
        <p>Entra na tua conta para continuar.</p>

        <form id="login-form">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="password">Palavra-passe</label>
            <input type="password" id="password" required>
            
            
            <a href="#" id="forgot-password">
            Esqueci-me da palavra-passe
            </a>

            <button type="submit" id="login-btn">Entrar</button>
            <p id="login-message"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dados/supabase.js"></script>

    <script>
        document.getElementById("forgot-password").addEventListener("click", async (e) => {
            e.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            
            if (!email) {
                message.textContent = "Introduz primeiro o teu e-mail.";
                return;
            }
            
            const { error } = await kynenceSupabase.auth.resetPasswordForEmail(email, {
                redirectTo: "https://shirayachiseven-hss.github.io/KYNENCE-LAB/redefinir-senha.html"
            });
            
            message.textContent = error ?
                error.message :
                "Enviámos um novo link de recuperação para o teu e-mail.";
        });
    
        const form = document.getElementById("login-form");
        const message = document.getElementById("login-message");
        const button = document.getElementById("login-btn");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            message.textContent = "A autenticar...";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const { data, error } = await kynenceSupabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                message.textContent = "Erro: " + error.message;
                button.disabled = false;
                return;
            }

            message.textContent = "Login efetuado!";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);
        });
    </script>

</body>
</html>
