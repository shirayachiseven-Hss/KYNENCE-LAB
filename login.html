<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | KYNENCE LAB</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        <h1>KYNENCE LAB</h1>
        <p>Entra na tua conta para continuar.</p>

        <form id="login-form">
            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="password">Palavra-passe</label>
            <input type="password" id="password" required>

            <button type="submit" id="login-btn">Entrar</button>
            <p id="login-message"></p>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dados/supabase.js"></script>

    <script>
        const form = document.getElementById("login-form");
        const message = document.getElementById("login-message");
        const button = document.getElementById("login-btn");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            message.textContent = "A autenticar...";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            const { data, error } = await kynenceSupabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                message.textContent = "Erro: " + error.message;
                button.disabled = false;
                return;
            }

            message.textContent = "Login efetuado!";

            setTimeout(() => {
                window.location.href = "index.html";
            }, 800);
        });
    </script>

</body>
</html>
